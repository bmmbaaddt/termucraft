# Builds TermuCraft on GitHub's Windows servers and publishes the release.
#
#   Release:  git tag v1.0.2 && git push origin v1.0.2   -> build, test, publish GitHub release
#   Try out:  Actions tab -> "Build & release" -> Run workflow  -> build + test only, files under "Artifacts"
name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # publish the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build installer + portable
        run: npm run dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: termucraft-windows
          path: |
            dist/TermuCraft-*-x64.exe
            dist/TermuCraft-*-portable.exe
          if-no-files-found: error

      - name: Collect files to publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/TermuCraft-*-x64.exe, dist/TermuCraft-*-portable.exe -Destination out
          Get-ChildItem out | Format-Table Name, Length

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
